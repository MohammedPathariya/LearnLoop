<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160" role="img" aria-labelledby="title desc">
  <title id="title">Open Render API health check</title>
  <desc id="desc">Animated call-to-action card for the LearnLoop Render API health endpoint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#28334a"/>
      <stop offset="1" stop-color="#3d4e68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102a43" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="584" height="144" rx="24" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="62" cy="80" r="16" fill="#7ee2a8" opacity=".25">
    <animate attributeName="r" values="16;28;16" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;0;.45" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="62" cy="80" r="9" fill="#9bf0b9"/>
  <text x="100" y="70" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700">Check API health</text>
  <text x="100" y="105" fill="#d7e1ec" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">Render endpoint · opens in a new tab</text>
  <path d="M520 72h28m-12-12 12 12-12 12" fill="none" stroke="#9bf0b9" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="1.6s" repeatCount="indefinite"/>
  </path>
</svg>
