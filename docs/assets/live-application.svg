<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120" role="img" aria-labelledby="title desc">
  <title id="title">Open the live LearnLoop application</title>
  <desc id="desc">Animated call-to-action card for the LearnLoop live application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#173b6c"/>
      <stop offset="1" stop-color="#245f91"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102a43" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="488" height="108" rx="18" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="42" cy="60" r="11" fill="#8de1c1" opacity=".25">
    <animate attributeName="r" values="11;19;11" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;0;.45" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="60" r="6" fill="#b7f7dc"/>
  <text x="70" y="69" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="700">Live app</text>
  <path d="M438 60h22m-10-9 10 9-10 9" fill="none" stroke="#b7f7dc" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="1.6s" repeatCount="indefinite"/>
  </path>
</svg>
