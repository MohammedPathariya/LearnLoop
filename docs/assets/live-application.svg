<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-labelledby="title desc">
  <title id="title">Open the live LearnLoop application</title>
  <desc id="desc">Animated call-to-action card for the LearnLoop live application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#173b6c"/>
      <stop offset="1" stop-color="#245f91"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102a43" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="704" height="144" rx="24" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="66" cy="80" r="16" fill="#8de1c1" opacity=".25">
    <animate attributeName="r" values="16;28;16" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;0;.45" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="66" cy="80" r="9" fill="#b7f7dc"/>
  <text x="106" y="70" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="700">Open LearnLoop</text>
  <text x="106" y="105" fill="#c9e7f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Live study workspace · opens in a new tab</text>
  <path d="M642 72h28m-12-12 12 12-12 12" fill="none" stroke="#b7f7dc" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="1.6s" repeatCount="indefinite"/>
  </path>
</svg>
