services:
  backend:
    build: ./backend
    container_name: learnloop-backend
    ports:
      - "5050:5050"
    env_file:
      - ./backend/.env
    environment:
      SUPABASE_DB_URI: sqlite:////app/data/conversations.db
    volumes:
      - learnloop-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: learnloop-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  learnloop-data:
